<meta name="theme-color" content="#ffffff">
<style>
:root{--navy:#1b2a4a;--red:#8b1a1a;--gold:#c9a227;--ink:#1a1a1a;--line:#e4e0d8;--bg:#f7f6f2;--meta:#b0b0b0;
--paper:#fff;--muted:#6b6b6b;--ok:#2e7d32;}
*{box-sizing:border-box}html{scroll-behavior:smooth}
/* Desktop: render the whole page slightly smaller (phone layout untouched) */
@media (min-width:561px){body{zoom:.85}}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:var(--ink);background:var(--bg);line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:132px}
header{background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 7px}
.brand{display:flex;align-items:center;gap:16px;max-width:1120px;margin:0 auto}
.logo-card{background:#fff;border-radius:10px;padding:5px 10px;display:inline-flex;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.logo{height:36px;width:auto;display:block}
.sub{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:#b9c4dc;font-weight:600}
.langtog{margin-left:auto;display:flex;border:1px solid #3a4a6b;border-radius:8px;overflow:hidden}
.langtog button{background:transparent;color:#b9c4dc;border:none;padding:8px 12px;font-size:.78rem;font-weight:700;cursor:pointer;letter-spacing:.05em}
.langtog button+button{border-left:1px solid #3a4a6b}
.langtog button.on{background:var(--gold);color:#1a1a1a}
.tagline{max-width:1120px;margin:8px auto 0;font-size:.8rem;color:#d7ddea}
.controls{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 18px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.controls-inner{max-width:1120px;margin:0 auto}
#search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;font-size:.95rem;background:var(--paper)}
#search:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:1120px;margin:8px auto 0}
.chip{font-size:.72rem;padding:6px 12px;border-radius:999px;color:#fff;text-decoration:none;cursor:pointer;white-space:nowrap;font-weight:700;border:1px solid rgba(0,0,0,.05);opacity:calc(.78 + .22*max(var(--litv,0),var(--onv,0)));transform:translateY(calc(var(--onlift,0px) + var(--litlift,0px))) scale(var(--litscale,1));box-shadow:var(--ring,0 0 #0000),var(--glow,0 0 #0000);will-change:transform}
.chip:hover{--onv:1}
.chip.on{--onv:1;--onlift:-1px;--ring:0 0 0 2px var(--bg),0 0 0 4px var(--acc,var(--navy)),0 2px 6px rgba(0,0,0,.18)}
.vatbar{background:var(--gold);color:#1a1a1a;font-size:.76rem;font-weight:700;letter-spacing:.04em;text-align:center;padding:7px 18px}
.details{max-width:1120px;margin:14px auto 0;padding:0 18px;display:flex;gap:10px;flex-wrap:wrap}
.details input{flex:1 1 200px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:.92rem;background:var(--paper)}
.details input:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.details input.err{border-color:var(--red);outline:2px solid var(--red);background:#fff}
.newcust-toggle{flex:0 0 auto;padding:11px 14px;border:1px dashed var(--navy);background:#fff;color:var(--navy);border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer}
.newcust-toggle.open{background:var(--navy);color:#fff;border-style:solid}
.newcust{max-width:1120px;margin:10px auto 0;padding:0 18px;display:none;gap:10px;flex-wrap:wrap}
.newcust.show{display:flex}
.newcust input{flex:1 1 220px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:.92rem;background:var(--paper)}
.newcust input:focus{outline:2px solid var(--navy);border-color:var(--navy)}
.newcust input.err{border-color:var(--red);outline:2px solid var(--red);background:#fff}
.btn.wa{background:#25d366;color:#fff}
main{max-width:1120px;margin:14px auto 0;padding:0 18px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.cat .rows{border-radius:0 0 12px 12px;overflow:hidden}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;color:#fff;cursor:pointer;user-select:none;gap:10px;border-radius:12px 12px 0 0;
 position:sticky;top:var(--stickytop,86px);z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.10)}
.cat{scroll-margin-top:calc(var(--stickytop,86px) + 8px)}
.cat-head h2{margin:0;font-size:.98rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.cat-head .count{font-size:.72rem;opacity:.9;font-weight:600;white-space:nowrap}
.cat-right{display:flex;align-items:center;gap:12px;flex:0 0 auto;min-width:0}
/* the pill tints itself from the heading's own text colour, so it stays legible
   on both the dark navy sections and the pale pink/gold ones */
.chint{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:600;letter-spacing:.03em;
 white-space:nowrap;color:inherit;opacity:.85;border-radius:999px;padding:3px 9px 3px 7px;
 background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
 background:color-mix(in srgb,currentColor 15%,transparent);
 border:1px solid color-mix(in srgb,currentColor 32%,transparent);
 transition:opacity .15s,background .15s}
.cat-head:hover .chint{opacity:1;background:color-mix(in srgb,currentColor 26%,transparent)}
.chint .cv{display:inline-block;font-size:.72rem;line-height:1;transition:transform .22s ease}
.cat-head.closed .chint .cv{transform:rotate(-90deg)}
.cat-note{padding:9px 16px;font-size:.76rem;color:var(--muted);background:#fbfaf6;border-bottom:1px solid var(--line)}
.rows{display:block}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;gap:11px;align-items:center;padding:7px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}.row.hidden{display:none}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#efece4;display:block;cursor:zoom-in;border:1px solid var(--line)}
.thumb.ph{display:flex;align-items:center;justify-content:center;cursor:default;background:linear-gradient(135deg,#26375c,#1b2a4a);color:#8ea2c8;font-weight:700;font-size:1.45rem;border:none}
.pname{font-size:.92rem;font-weight:600}
.pinfo{min-width:0}
.meta,.meta .note{overflow-wrap:anywhere}
.plname{display:none;font-weight:400;color:#8a8a8a;font-size:.82rem;margin-left:6px}
body.pl .plname{display:inline}
.badge{display:inline-block;font-size:.56rem;font-weight:800;letter-spacing:.05em;padding:3px 9px;border-radius:999px;vertical-align:middle;line-height:1;text-transform:uppercase}
.badge.TOP{background:#c9a227;color:#1b2a4a}.badge.NEW{background:#8b1a1a;color:#fdf7e3}
.price .badge{margin:0 7px 0 0}
.meta{font-size:.68rem;color:var(--meta);font-weight:400;margin-top:2px}
.osize{font-size:1.05rem;font-weight:800;color:var(--navy);margin-top:3px;letter-spacing:.01em}
.cart-sz{font-weight:800;color:var(--navy);margin-left:8px}

 if(!secs.length)return;

const search=document.getElementById('search');
search.addEventListener('input',()=>{
 const q=normStr(search.value);const toks=q?q.split(' '):[];
 /* A token matches a row if it's a substring of the row's search text (FR/PL/EN name,
    code, origin, notes, flavours); OR — for real words (len>=5, no digits) — some word in
    the row shares a >=4-char prefix and is within a small edit distance. The prefix anchor
    lets Polish inflections match (kaczka~kaczki, both stem "kacz") and rescues typos, while
    blocking unrelated near-spellings (losos~lomo) and keeping product codes/sizes exact. */
 const digit=t=>/[0-9]/.test(t);
 const cpl=(a,b)=>{let i=0;const n=Math.min(a.length,b.length);while(i<n&&a[i]===b[i])i++;return i;};
 const near=(s,t)=>{
   if(s.includes(t))return true;
   if(t.length<5||digit(t))return false;
   const words=s.split(' '),thr=t.length<=7?1:2;
   return words.some(w=>w.length>=5&&!digit(w)&&cpl(w,t)>=4&&Math.abs(w.length-t.length)<=thr&&lev(w,t)<=thr);};
 const matchFn=r=>{const s=r.dataset.search;return !q||toks.every(t=>near(s,t));};
 document.querySelectorAll('.cat').forEach(sec=>{let vis=0;
  sec.querySelectorAll('.row').forEach(r=>{const m=matchFn(r);r.classList.toggle('hidden',!m);if(m)vis++;});
  sec.style.display=vis?'':'none';
  const hd=sec.querySelector('.cat-head');if(q&&hd)setOpen(hd,true);});
 spyTop=syncStickyTop();spy();});

function unitsOf(s){return s.isKg&&s.item.w?Math.round(s.qty/s.item.w*100)/100:s.qty;}
function allocSum(s){return Object.values(s.fa).reduce((a,b)=>a+b,0);}
function hasFlav(s){return !!(s.item.fl&&!s.isKg);}
function clampAlloc(s){if(!hasFlav(s))return;const un=Math.round(unitsOf(s));let sum=allocSum(s);
 for(let i=s.item.fl.length-1;i>=0&&sum>un;i--){const c=s.fa[i]||0;const cut=Math.min(c,sum-un);if(cut){s.fa[i]=c-cut;sum-=cut;}}}
function itemTotal(s){
 if(hasFlav(s)&&s.item.fl.some(f=>f.p!=null)){let t=0,al=0;
  s.item.fl.forEach((f,i)=>{const c=s.fa[i]||0;al+=c;t+=c*(f.p!=null?f.p:s.item.p);});
  return t+Math.max(0,s.qty-al)*s.item.p;}
 return s.qty*s.item.p;}

function buildOrderText(style){
 const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
 const cust=g('cust'),fn=g('cFirst'),sn=g('cSurname'),ph=g('cPhone'),em=g('cEmail'),ad=g('cAddr'),nip=g('cNip');
 const full=(fn+' '+sn).trim();
 const d=new Date();const dd=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
 let L=['COMMANDE MDP — '+dd,''];
 L.push('Client : '+(cust||full||'(merci d\'indiquer le nom)'));
 if(full&&cust&&full.toLowerCase()!==cust.toLowerCase())L.push('Nom : '+full);
 if(ph)L.push('Téléphone : '+ph);
 if(em)L.push('E-mail : '+em);
 if(ad)L.push('Livraison : '+ad);
 if(nip)L.push('NIP : '+nip);
 L.push('');
 // Flat product lines — French name, code first, NO per-item prices, NO category headers
 const IL=[];
 CATEGORIES.forEach(c=>{const pk=Object.entries(state).filter(([k,s])=>s.qty>0&&s.cat===c.label);if(!pk.length)return;
  pk.forEach(([k,s])=>{const n=s.item.n;const code=s.item.c?s.item.c+' ':'';
   if(s.isKg&&s.item.w){
    const units=s.qty/s.item.w, ui=Math.round(units);
    const uDisp=Math.abs(units-ui)<0.01?ui:Number(units.toFixed(2));
    IL.push('  '+cnt(uDisp,style)+'x '+code+unitW(s.item.w)+' '+stripW(n));}
   else if(s.isKg){
    IL.push('  '+cnt(fmtQ(s.qty),style)+' kg x '+code+n);}
   else if(hasFlav(s)){let rem=s.qty;
    s.item.fl.forEach((f,i)=>{const cq=s.fa[i]||0;if(!cq)return;rem-=cq;
     // each type keeps its own code so MDP can auto-match; fall back to the product code
     const fcode=(f.c||s.item.c)?((f.c||s.item.c)+' '):'';
     IL.push('  '+cnt(cq,style)+'x '+fcode+n+' — '+f.n);});
    if(rem>0)IL.push('  '+cnt(rem,style)+'x '+code+n);}
   else IL.push('  '+cnt(s.qty,style)+'x '+code+n+(s.item.sz?' '+s.item.sz:''));});});
 // one continuous list — no blank lines between items
 IL.forEach(ln=>L.push(ln));
 L.push('');
 const ex=getExtras();
 if(ex.length){L.push('DEMANDES SPÉCIALES / HORS LISTE (prix à confirmer)');ex.forEach(x=>L.push('  - '+x));L.push('');}
 L.push('Le prix final varie selon le poids réel des produits.');
 return L.join('\n');}

 const it=s.item,un=Math.round(unitsOf(s)),sum=allocSum(s);
 const box=document.createElement('div');box.className='cart-flav'+(sum!==un?' need':'');
 const t=document.createElement('div');t.className='cart-flav-t'+(sum===un?' done':'');
 const isz=it.ot==='size';
 t.textContent=sum===un?(isz?T[lang].sizeOk:T[lang].flavOk):((isz?T[lang].chooseSize:T[lang].chooseFlav)+' — '+(un-sum)+' '+T[lang].flavLeft);
 box.appendChild(t);
 it.fl.forEach((f,i)=>{
  const rw=document.createElement('div');rw.className='flavrow';
  const fn=document.createElement('span');fn.className='fn';fn.textContent=f.n;rw.appendChild(fn);
  if(f.p!=null){const fp=document.createElement('span');fp.className='fp';fp.textContent=f.p.toFixed(2)+' PLN';rw.appendChild(fp);}
  const fq=document.createElement('div');fq.className='flavq';
  const m=document.createElement('button');m.type='button';m.textContent='−';
  const v=document.createElement('span');v.textContent=s.fa[i]||0;
  const p=document.createElement('button');p.type='button';p.textContent='+';
  m.disabled=!((s.fa[i]||0)>0);p.disabled=sum>=un;
  m.onclick=()=>{s.fa[i]=Math.max(0,(s.fa[i]||0)-1);recalc();renderCart();};
  p.onclick=()=>{if(allocSum(s)>=Math.round(unitsOf(s)))return;s.fa[i]=(s.fa[i]||0)+1;recalc();renderCart();};
  fq.append(m,v,p);rw.appendChild(fq);box.appendChild(rw);});
 return box;}
function cartItemRow(k,s){
 const it=s.item;const wrap=document.createElement('div');wrap.className='cart-item';
 const line=document.createElement('div');line.className='cart-line';
 const nm=document.createElement('div');nm.className='cart-nm';
 nm.innerHTML=(it.c?'<span class="ccode">'+esc(it.c)+'</span>':'')+langSpans(l=>nameIn(it,l))+(it.sz?'<span class="cart-sz">'+esc(it.sz)+'</span>':'');
 const sub=document.createElement('div');sub.className='cart-sub';
 sub.textContent=(it.pr?it.pr:it.p.toFixed(2))+' PLN/'+(s.isKg?'kg':puIn(it.pu,lang));
 nm.appendChild(sub);
 const q=document.createElement('div');q.className='cart-qty';
 const mi=document.createElement('button');mi.type='button';mi.textContent='−';
 const qv=document.createElement('span');
 if(s.isKg){qv.innerHTML=fmtQ(s.qty)+'<sub class="ckg">kg</sub>';}else{qv.textContent=fmtQ(s.qty);}
 const pl2=document.createElement('button');pl2.type='button';pl2.textContent='+';

 q.append(mi,qv,pl2);
 const lt=document.createElement('div');lt.className='cart-lt';lt.textContent=itemTotal(s).toFixed(2);
 line.append(nm,q,lt);wrap.appendChild(line);
 if(hasFlav(s))wrap.appendChild(flavBlock(k,s));
 return wrap;}
function renderCart(){

// Always keep at least MIN_ROWS product lines in view: shrink the header, footer and
// rows step by step until they fit (handles small laptops and browser zoom).
const MIN_ROWS=8;
function fitCart(){
 const card=document.querySelector('.cart-card');if(!card)return;
 card.classList.remove('dense','xdense');
 const visible=()=>{
  const rows=cartBody.querySelectorAll('.cart-item');if(!rows.length)return 99;
  let unit=Infinity;rows.forEach(r=>{const h=r.offsetHeight;if(h>0&&h<unit)unit=h;});
  if(!isFinite(unit)||unit<=0)return 99;
  return cartBody.clientHeight/unit;};
 if(visible()<MIN_ROWS)card.classList.add('dense');
 if(visible()<MIN_ROWS)card.classList.add('xdense');}

/* ---------- Compass: category chips light toward the pointer ----------
   One mousemove + one rAF loop. The whole viewport width is the dial: the
   chip lying in the pointer's horizontal direction lights up (glow + lift),
   and the highlight sweeps as the pointer moves — anywhere on the page.
   Coexists with the scroll-spy '.on' ring, which stays as a position marker.
   Cursor-only; never engages on touch, and idles under reduced-motion. */
(function(){
 const RM=matchMedia('(prefers-reduced-motion: reduce)');
 let reduced=RM.matches;
 const clearChip=el=>{const s=el.style;['--litv','--litlift','--litscale','--glow'].forEach(p=>s.removeProperty(p));};
 const resetAll=()=>chips.forEach(c=>{c.v=0;clearChip(c.el);});
 RM.addEventListener('change',e=>{reduced=e.matches;if(reduced)resetAll();});
 const accRGB=el=>{let h=getComputedStyle(el).getPropertyValue('--acc').trim().replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);return isFinite(n)&&h.length>=6?[n>>16&255,n>>8&255,n&255]:[27,42,74];};
 let chips=[];
 const collect=()=>{chips=[...chipsEl.querySelectorAll('.chip')].map(el=>({el,acc:accRGB(el),v:0,t:0,cx:0}));};
 collect();
 let px=innerWidth/2,engaged=false;
 addEventListener('mousemove',e=>{px=e.clientX;engaged=true;},{passive:true});
 function frame(){
  requestAnimationFrame(frame);
  if(reduced||!engaged||!chips.length)return;
  if(chips.length!==chipsEl.querySelectorAll('.chip').length)collect(); /* re-render safety */
  const vis=chips.filter(c=>c.el.offsetParent!==null);
  if(vis.length){
   vis.forEach(c=>{c.cx=c.el.getBoundingClientRect().left+c.el.offsetWidth/2;});
   const first=vis[0].cx,last=vis[vis.length-1].cx;
   const pos=first+Math.max(0,Math.min(1,px/innerWidth))*(last-first);
   const sigma=Math.max(42,(last-first)/vis.length*0.85);
   vis.forEach(c=>{const d=c.cx-pos;c.t=Math.exp(-(d*d)/(2*sigma*sigma));});
  }
  chips.forEach(c=>{
   const target=c.el.offsetParent!==null?c.t:0;
   c.v+=0.18*(target-c.v);
   if(c.v<0.004){clearChip(c.el);return;}
   const v=c.v,s=c.el.style,a=c.acc;
   s.setProperty('--litv',v.toFixed(3));
   s.setProperty('--litlift',(-3*v).toFixed(2)+'px');
   s.setProperty('--litscale',(1+0.05*v).toFixed(3));
   s.setProperty('--glow','0 '+(3+8*v).toFixed(1)+'px '+(8+16*v).toFixed(1)+'px rgba('+a[0]+','+a[1]+','+a[2]+','+(0.42*v).toFixed(3)+')');
  });
 }
 requestAnimationFrame(frame);
})();
